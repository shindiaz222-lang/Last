<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#795138">
<meta name="description" content="SchoolTrack Offline School Inventory System">
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="style.css">
<title>SchoolTrack</title>
</head>
<body>
<div id="app">
<header class="topbar">
  <div class="brand"><div class="brand-icon">📋</div><div><div class="brand-name">SchoolTrack</div><div class="brand-sub">OFFLINE INVENTORY SYSTEM</div></div></div>
  <div class="top-actions"><button class="icon-btn" id="themeBtn" title="Toggle theme">🌙</button><button class="icon-btn" id="soundBtn" title="Toggle sounds">🔊</button></div>
</header>
<main>
<section id="dashboard" class="page active">
  <div class="welcome"><div><p class="eyebrow">SCHOOL INVENTORY</p><h1>Dashboard</h1><p id="stockMessage">Your inventory at a glance.</p></div><button class="primary" data-nav="add">＋ Add Item</button></div>
  <div class="stats">
    <div class="stat"><span>Total Items</span><strong id="totalCount">0</strong></div><div class="stat good"><span>In Stock</span><strong id="inCount">0</strong></div><div class="stat warn"><span>Low Stock</span><strong id="lowCount">0</strong></div><div class="stat bad"><span>Out of Stock</span><strong id="outCount">0</strong></div><div class="stat"><span>Borrowed</span><strong id="borrowedCount">0</strong></div><div class="stat"><span>Repair</span><strong id="repairCount">0</strong></div><div class="stat bad"><span>Missing</span><strong id="missingCount">0</strong></div>
  </div>
  <div class="panel"><div class="panel-head"><h2>Stock Alerts</h2><button class="text-btn" data-nav="inventory">View inventory →</button></div><div id="alerts"></div></div>
</section>
<section id="inventory" class="page">
  <div class="page-head"><div><p class="eyebrow">RECORDS</p><h1>Inventory</h1></div><button class="primary" data-nav="add">＋ Add Item</button></div>
  <div class="toolbar"><input id="search" placeholder="Search ID, name, category, location…"><select id="filter"><option value="all">All stock status</option><option value="in">In Stock</option><option value="low">Low Stock</option><option value="out">Out of Stock</option><option value="borrowed">Borrowed</option><option value="repair">Repair</option><option value="missing">Missing</option></select></div>
  <div id="inventoryList" class="item-list"></div>
</section>
<section id="add" class="page">
  <div class="page-head"><div><p class="eyebrow">RECORD</p><h1 id="formTitle">Add Item</h1></div></div>
  <form id="itemForm" class="form panel">
    <input type="hidden" id="editIndex">
    <label>Item ID<input id="itemId" required maxlength="40" placeholder="e.g. ICT-001"></label>
    <label>Item Name<input id="itemName" required maxlength="80" placeholder="e.g. Desktop Computer"></label>
    <div class="two"><label>Category<input id="category" placeholder="Computer, furniture…"></label><label>Quantity<input id="quantity" required type="number" min="0" step="1" inputmode="numeric" value="1"></label></div>
    <div class="two"><label>Condition<select id="condition"><option>Good</option><option>Fair</option><option>Damaged</option><option>For Repair</option></select></label><label>Location<input id="location" placeholder="ICT Room"></label></div>
    <label>Person Responsible<input id="responsible" placeholder="Name or office"></label>
    <label>Remarks<textarea id="remarks" rows="3" placeholder="Optional notes"></textarea></label>
    <div class="form-actions"><button type="submit" class="primary">💾 Save Item</button><button type="button" class="secondary" id="cancelEdit">Cancel</button></div>
  </form>
</section>
<section id="reports" class="page">
  <div class="page-head"><div><p class="eyebrow">ISSUES</p><h1>Problem Reports</h1></div><button class="primary" id="newReportBtn">＋ New Report</button></div>
  <div id="reportList" class="item-list"></div>
</section>
<section id="history" class="page">
  <div class="page-head"><div><p class="eyebrow">ACTIVITY</p><h1>History</h1></div></div>
  <div class="panel"><div class="backup-grid"><button class="secondary" id="backupBtn">⬇ Backup JSON</button><label class="file-btn">⬆ Restore JSON<input id="restoreFile" type="file" accept="application/json"></label><button class="secondary" id="csvBtn">📊 Export CSV</button></div></div>
  <div id="historyList" class="item-list"></div>
</section>
</main>
<nav class="bottom-nav"><button data-nav="dashboard" class="active">🏠<span>Home</span></button><button data-nav="inventory">📦<span>Inventory</span></button><button data-nav="reports">📝<span>Reports</span></button><button data-nav="history">🕘<span>History</span></button></nav>
<div id="toast" role="status" aria-live="polite"></div>
<audio id="clickSound" preload="auto" src="click-sound.mp3"></audio>
</div>
<script src="app.js"></script>
</body>
</html>
